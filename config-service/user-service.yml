server:
  port: 8081
  forward-headers-strategy: framework   # ✅ IMPORTANT

spring:
  application:
    name: USER-SERVICE   # ✅ MUST MATCH GATEWAY

  datasource:
    url: jdbc:mysql://localhost:3306/user_db
    username: root
    password: I@mcbg91778
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  sql:
    init:
      mode: always

# ================= EUREKA =================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ================= SWAGGER =================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ================= LOGGING =================
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE